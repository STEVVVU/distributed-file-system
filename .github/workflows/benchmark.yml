name: Storage benchmark
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Isolated benchmark or separate native CPU profile
        options: [benchmark, profile]
        default: benchmark
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    # Retained real trials take about 55 s: 135 cells alone need about 124 min.
    # Include smoke, build, offered-rate/stability/recovery work and artifact upload.
    timeout-minutes: 210
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOMAXPROCS: 2
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go build -o .local/weed.exe ./weed
      - run: python3 -m unittest discover -s coursework -p test_*.py -v
      - run: python3 coursework/benchmark.py smoke
      - run: python3 coursework/benchmark.py ${{ inputs.mode }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: storage-benchmark-${{ inputs.mode }}-${{ github.sha }}
          path: |
            .local/benchmark-*/summary.json
            .local/benchmark-*/*.pstats
            .local/benchmark-trial-*/result.json
            .local/benchmark-trial-*/benchmark/*.json
            .local/benchmark-trial-*/*.log
            .local/benchmark-trial-*/*.pprof
            .local/benchmark-trial-*/placement-*.json
          include-hidden-files: true
          retention-days: 14


name: Coursework storage verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go build -o .local/weed.exe ./weed
      - run: go vet ./weed/storage/super_block ./weed/topology/balancer ./weed/server
      - run: go test ./weed/storage/super_block ./weed/topology/balancer
      - run: go test ./weed/shell -run 'Test.*(Replica|Replication)' -count=1
      - run: go test ./weed/server -run 'Test.*(ReplicaTarget|RemoteEndpoint|BlockedIP|VolumeCopy)' -count=1
      - run: test -z "$(gofmt -l weed/server/volume_grpc_copy_verify_test.go)"
      - run: python3 coursework/verify.py --run ci-recovery
      - name: Check deliberate failure and cleanup
        shell: bash
        run: |
          if python3 coursework/verify.py --run ci-failure --fail; then exit 1; fi
          python3 -c 'import json,pathlib; p=pathlib.Path(".local/ci-failure"); r=json.loads((p/"result.json").read_text()); assert r["passed"] is False and r["cleanup"] is True and r["error"] == "AssertionError: deliberate verification failure" and not (p/"data").exists()'
      - if: always()
        run: cat .local/ci-*/result.json
